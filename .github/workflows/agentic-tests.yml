name: Agentic tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/src/**'
      - 'frontend/src/**'
      - '.github/workflows/agentic-tests.yml'
      - 'scripts/agentic-tests/**'

permissions: {}

concurrency:
  group: agentic-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent:
    name: Write tests (agent)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-agentic-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.agent.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip the bot's own commits
        id: loop
        run: |
          if git log -1 --format=%B | grep -qF '[agentic-tests]'; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.loop.outputs.skip != 'true'
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        if: steps.loop.outputs.skip != 'true'
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm install --global @anthropic-ai/claude-code@2.1.295
      - name: Run test-writer agent
        id: agent
        if: steps.loop.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Present in the CLI binary of the pinned version 2.1.295: strips credentials from env of its subprocesses.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/agentic-tests/run.js --ci --stage agent --base "$BASE_SHA"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.agent.outputs.ran == 'true'
        with:
          name: agentic-tests-agent
          path: |
            .agentic-tests/state.json
            .agentic-tests/tests.patch
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      # Visible to anyone with read access to the repository; short retention.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && steps.loop.outputs.skip != 'true' }}
        with:
          name: agentic-tests-agent-log
          path: .agentic-tests/agent-output.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  verify:
    name: Verify generated tests
    needs: agent
    if: needs.agent.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentic-tests-agent
          path: ${{ runner.temp }}/agent-artifacts
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Verify generated tests (no secrets available here)
        env:
          ARTIFACTS: ${{ runner.temp }}/agent-artifacts
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/agentic-tests/run.js --ci --stage verify --artifacts "$ARTIFACTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agentic-tests-publish
          path: .agentic-tests/publish/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agentic-tests-report
          path: |
            .agentic-tests/report.json
            .agentic-tests/report.md
          include-hidden-files: true
          retention-days: 14

  publish:
    name: Commit and comment
    needs: [agent, verify]
    if: ${{ !cancelled() && needs.verify.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Runner scripts come from the base branch, never from the PR: this job holds the write token.
      # No npm install, no test code runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      # A missing bundle must still reach run.js, which reports it as a publish-failed comment.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agentic-tests-publish
          path: ${{ runner.temp }}/publish-bundle
      - name: Commit tests and update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BUNDLE: ${{ runner.temp }}/publish-bundle
        run: node scripts/agentic-tests/run.js --ci --stage publish --artifacts "$BUNDLE"

  fork-notice:
    name: Fork PR notice
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Agentic tests run only for pull requests from branches in this repository (secrets are unavailable to forks)." >> "$GITHUB_STEP_SUMMARY"
